heading:
  ru:
    eyebrow: Умные замки под ключ
    accent: включено
    text: >+
      При покупке замков "Все включено", в стоимость входят доставка до вашего
      адреса, профессиональная установка нашими мастерами, все необходимые
      расходные материалы, а также гарантия на замок. Предложение действует
      только на модели, отмеченные специальным значком "Все включено".

  kk:
    eyebrow: Барлығы бағаға кіреді
    accent: Барлығы бағаға кіреді
    text: >-
      «Барлығы қамтылған» белгісі бар құлыптарды сатып алған кезде бағаға
      мекенжайыңызға дейін жеткізу, кәсіби шеберлеріміздің орнатуы, барлық
      қажетті қосымша материалдар және құлыпқа берілетін кепілдік кіреді. Ұсыныс
      тек арнайы «Барлығы қамтылған» белгісімен белгіленген модельдерге
      қолданылады.
  en:
    eyebrow: Smart Locks — Turnkey Solution
    accent: All-Inclusive
    text: >-
      When purchasing smart locks marked with the “All-Inclusive” label, the
      price includes delivery to your address, professional installation by our
      technicians, all necessary installation materials, and a warranty for the
      lock. This offer is valid only for models marked with the special
      “All-Inclusive” badge.
