  seoTitle: EZVIZ L2S CS-L2S-11FCP-A0 — купить умный замок в Казахстане | iLOCK
  seoDescription: >-
    Умный замок EZVIZ L2S CS-L2S-11FCP-A0: отпечаток, карта, пин-код,
    механический ключ, Zigbee 3.0 и до 12 месяцев работы на батарейках AA.
  body: >-
    EZVIZ L2S — умный замок с отпечатком пальца и управлением через мобильное
    приложение.


    Модель поддерживает пять способов открытия: отпечаток пальца, PIN-код, карта
    или брелок, мобильное приложение EZVIZ и механический ключ.


    Замок оснащён Wi-Fi, сигнализацией при попытке вскрытия и уведомлением о
    низком заряде батареи. Работает от четырёх батареек AA, обеспечивая до 10
    месяцев автономной работы.


    Также предусмотрена функция аварийной зарядки.
