en:
  description: >-
    EZVIZ L2S with fingerprint, card, PIN and key access for a house, apartment
    or office. Up to a year of use on four AA batteries.
  seoTitle: EZVIZ L2S CS-L2S-11FCP-A0 — buy a smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    EZVIZ L2S CS-L2S-11FCP-A0 smart lock: fingerprint, card, PIN, mechanical
    key, Zigbee 3.0 and up to 12 months on AA batteries.
  body: >-
    EZVIZ L2S is a smart lock with fingerprint access and mobile app control.


    The model supports five unlocking methods: fingerprint, PIN code, card or
    key fob, the EZVIZ mobile app, and a mechanical key.


    The lock features Wi-Fi connectivity, a break-in alarm and a low battery
    notification. It operates on four AA batteries, providing up to 10 months of
    battery life.


    An emergency charging function is also available.
