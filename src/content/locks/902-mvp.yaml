    камерамен және екіжақты аудиобайланыс функциясымен жабдықталған. Wi-Fi және
    HomeAccess қосымшасының көмегімен есік алдындағы жағдайды бақылауға,
    келушілермен сөйлесуге және қашықтан хабарламалар алуға болады. Сонымен
