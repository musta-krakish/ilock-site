    құлыптау және сымсыз магниттік зарядтау функциялары қарастырылған.
en:
  description: >-
    Philips 902 MVP is a flagship smart door lock featuring facial and palm vein
    recognition, a triple-camera system, and remote control via Wi-Fi.
  seoTitle: 902 MVP — buy a Philips smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    Philips 902 MVP is a flagship smart door lock featuring facial and palm vein
    recognition, a triple-camera system, and remote control via Wi-Fi.
  body: >-
    Philips 902 MVP is a premium smart door lock that combines advanced
    recognition technologies with multi-layer home security. It offers 7
    unlocking methods: fingerprint recognition, PIN code, facial recognition,
    palm vein recognition, access card, mobile app, and mechanical key. The lock
    features a three-camera system for monitoring the entrance area, along with
    a video doorbell and two-way audio communication. With Wi-Fi connectivity
    and the HomeAccess app, you can monitor your entrance, communicate with
    visitors, and receive remote notifications. Additional features include a
    motion sensor, voice changing during video calls, automatic locking, and
    wireless magnetic charging.
