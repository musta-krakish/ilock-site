  body: >-
    Philips 902 MVP — премиальный умный дверной замок, который объединяет
    передовые технологии распознавания и многоуровневую защиту дома.
    Предусмотрено 7 способов открытия: отпечаток пальца, PIN-код, распознавание
    лица, распознавание вен ладони, карта доступа, мобильное приложение и
    механический ключ. Замок оснащён системой из трёх камер, которая позволяет
    контролировать пространство возле входной двери, а также видеоглазком и
    функцией двусторонней аудиосвязи. Благодаря Wi-Fi и приложению HomeAccess вы
    можете наблюдать за происходящим у двери, общаться с посетителями и получать
    уведомления удалённо. Дополнительно предусмотрены датчик движения, изменение
    голоса во время видеозвонка, автоматическое запирание и беспроводная
    магнитная зарядка. Philips 902 MVP — сочетание инновационных технологий,
    комфорта и высокого уровня безопасности.
