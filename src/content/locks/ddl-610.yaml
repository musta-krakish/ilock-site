  body: >-
    Philips DDL610 — современный умный дверной замок, который сочетает удобство
    использования, функциональность и надёжную защиту вашего дома. Предусмотрено
    6 способов открытия: отпечаток пальца, PIN-код, карта доступа, временный
    пароль, мобильное приложение и механический ключ. Замок оснащён быстрым
    сканером отпечатков пальцев, поддерживает создание временных паролей для
    гостей, скрытый PIN-код, автоматическое запирание двери, голосовые подсказки
    и бесшумный режим. Также предусмотрена сигнализация при попытках взлома и
    защита от открытия через дверной глазок. Удалённое управление доступно через
    приложение Philips Home Access при подключении специального шлюза Gateway.
    Сам замок соединяется со шлюзом по Bluetooth, а шлюз подключается к Wi-Fi. 

    Philips DDL610 — удобное решение для тех, кто ценит комфорт, современные
    технологии и безопасность своего дома.
