  seoTitle: Alpha VP — Қазақстанда Philips ақылды құлыпты сатып алу | iLOCK
  seoDescription: «Итер-тарт» режимі және жақындағанда құлыпты оятатын PIR-датчигі.
  body: >-
    Philips Alpha VP — бейне домофон мен қауіпсіздік жүйесінің мүмкіндіктерін
    біріктіретін заманауи ақылды есік құлпы. 144° кең бұрышты камерамен, 4
    дюймдік IPS дисплеймен жабдықталған және Wi-Fi желісіне қосылуды қолдайды.
    Есік алдындағы келушілерді көруге, олармен мобильді қосымша арқылы сөйлесуге
    және үйде болмасаңыз да, есік алдындағы қозғалыс туралы хабарламалар алуға
    мүмкіндік береді. PIR қозғалыс датчигі, түнгі көру режимі және бейнені
    автоматты түрде жазу функциялары есік алдындағы жағдайды бақылауға
    көмектеседі. Сонымен қатар, автоматты құлыптау және қонақтарға арналған
    уақытша PIN-кодтар қарастырылған.
en:
  description: >-
    Philips Alpha VP is a smart door lock featuring a 144° camera, a 4-inch IPS
    display, and Wi-Fi connectivity. It allows you to see visitors, talk to them
    through your smartphone, and monitor your entrance even when you are away
    from home.
  seoTitle: Alpha VP — buy a Philips smart lock in Kazakhstan | iLOCK
  seoDescription: A push-pull action and a PIR sensor that wakes the lock as you approach.
  body: >-
    Philips Alpha VP is a modern smart door lock that combines video intercom
    and security features. It is equipped with a 144° wide-angle camera, a
    4-inch IPS display, and Wi-Fi connectivity. It allows you to see visitors,
    communicate with them through a mobile app, and receive motion alerts even
    when you are away from home. The PIR motion sensor, night vision, and
    automatic video recording help you monitor activity at your entrance.
    Additional features include automatic door locking and temporary PIN codes
    for guests.
