ru:
  description: >-
    Philips Alpha VP — умный дверной замок со встроенной камерой 144°,
    4-дюймовым экраном и Wi-Fi. Позволяет видеть посетителей, общаться с ними
    через смартфон и контролировать входную дверь даже находясь вне дома.
  seoTitle: Alpha VP — купить умный замок Philips в Казахстане | iLOCK
  seoDescription: Режим «толкни-потяни» и PIR-датчик, который будит замок при приближении.
  body: >-
    Philips Alpha VP — современный умный дверной замок, который объединяет
    функции видеодомофона и системы безопасности. Оснащён широкоугольной камерой
    144°, 4-дюймовым IPS-дисплеем и поддерживает подключение к Wi-Fi. Позволяет
    видеть посетителей, общаться с ними через мобильное приложение и получать
    уведомления о движении возле двери, даже находясь вне дома. Благодаря
    PIR-датчику, ночному видению и автоматической записи видео вы всегда можете
    контролировать происходящее у входа. Также предусмотрены автоматическое
    запирание двери и временные PIN-коды для гостей.
kk:
  description: >-
    Philips Alpha VP — 144° камерасы, 4 дюймдік IPS дисплейі және Wi-Fi
    байланысы бар ақылды есік құлпы. Есік алдындағы келушілерді көруге, олармен
    телефон арқылы сөйлесуге және үйде болмасаңыз да, есік алдындағы жағдайды
