ru:
  description: >-
    Премиальный умный замок Philips с семью способами разблокировки, включая
    Face ID и распознавание вен ладони. Три камеры, видеоглазок, PIR-датчик,
    Wi-Fi и управление через приложение HomeAccess. Аккумулятор 5000 мАч с
    беспроводной подзарядкой.
  seoTitle: ' Philips 902 MVP — купить умный замок Philips в Казахстане | iLOCK'
  seoDescription: >-
    Умный дверной замок Philips 902 MVP с трёхсторонней камерой, Face ID и
    распознаванием вен, золотой
  body: >-
    Philips 902 MVP — флагманский умный замок в золотом корпусе из цинкового
    сплава и закалённого стекла, который сочетает премиальный дизайн с
    максимальным уровнем защиты. Дверь открывается семью способами: по
    распознаванию лица Face ID, по венам ладони, отпечатку пальца, PIN-коду,
    карте-брелоку, через приложение или механическим ключом. Распознавание вен —
    одна из самых надёжных биометрических технологий: рисунок сосудов невозможно
    подделать или скопировать. Трёхсторонняя камера и видеоглазок показывают
    всё, что происходит у двери, а PIR-датчик замечает движение и заранее
    предупреждает о том, что у двери кто-то есть. Встроенный дверной звонок и
    двусторонняя аудиосвязь позволяют поговорить с гостем прямо из приложения, а
    функция изменения голоса при видеосвязи защищает вашу приватность, когда вы
    разговориваете с незнакомцами. Через приложение HomeAccess по Wi-Fi можно
    управлять замком из любой точки мира. Замок полностью автоматический:
    запирается и отпирается без лишних действий. В памяти помещаются до 100
    отпечатков, 60 PIN-кодов, 50 лиц и 50 рисунков вен ладони. Литий-полимерный
    аккумулятор на 5000 мАч работает без подзарядки от 3 до 6 месяцев и
    поддерживает беспроводную зарядку. Замок работает при температуре от −20 до
    +60 °C, интерфейс на русском и английском языках, гарантия 2 года. Philips
    902 MVP подойдёт тем, кто хочет максимальную безопасность без компромиссов в
    стиле.
kk:
