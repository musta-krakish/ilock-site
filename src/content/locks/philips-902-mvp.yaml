  seoTitle: Philips 902 MVP — Қазақстанда Philips ақылды құлпын сатып алу | iLOCK
  seoDescription: >-
    Үш жақты камерасы, Face ID және алақан тамырларын тану функциясы бар алтын
    түсті Philips 902 MVP ақылды есік құлпы
  body: >-
    Philips 902 MVP — мырыш қорытпасынан және шыңдалған шыныдан жасалған алтын
    түсті корпустағы флагмандық ақылды құлып. Премиум дизайн мен жоғары
    деңгейдегі қауіпсіздікті үйлестіреді.


    Есікті ашудың 7 тәсілі бар: Face ID арқылы бет-әлпетті тану, алақан
    тамырларын тану, саусақ ізі, PIN-код, карта-брелок, мобильді қолданба немесе
    механикалық кілт.


    Алақан тамырларын тану — ең сенімді биометриялық технологиялардың бірі. Қан
    тамырларының суретін қолдан жасау немесе көшіру мүмкін емес.


    Үш жақты камера мен бейнекөзше есік алдындағы жағдайды толық бақылауға
    мүмкіндік береді, ал PIR-қозғалыс датчигі қозғалысты анықтап, есік алдында
    біреудің бар екенін алдын ала хабарлайды.


    Кіріктірілген есік қоңырауы мен екіжақты аудиобайланыс арқылы қонақпен
    тікелей қолданба арқылы сөйлесуге болады. Бейнеқоңырау кезінде дауысты
    өзгерту функциясы бейтаныс адамдармен сөйлескенде жеке өміріңіздің
    құпиялылығын сақтауға көмектеседі.


    Wi-Fi арқылы HomeAccess қолданбасын пайдаланып, құлыпты әлемнің кез келген
    нүктесінен басқаруға болады.


    Құлып толығымен автоматты түрде жұмыс істейді: қосымша әрекеттерді қажет
    етпей, есікті өзі құлыптап, ашады.


    Жадына 100 саусақ ізі, 60 PIN-код, 50 бет-әлпет және 50 алақан тамырының
    үлгісін сақтауға болады.


    5000 мА·сағ литий-полимерлі аккумуляторы бір қуаттаумен 3–6 ай жұмыс істейді
    және сымсыз қуаттауды қолдайды.

    - Жұмыс температурасы: −20-дан +60 °C-қа дейін

    - Интерфейс тілдері: орыс және ағылшын тілдері

    - Кепілдік: 2 жыл

    Philips 902 MVP — стиль мен қауіпсіздіктен ымыраға келгісі келмейтіндерге
    арналған ақылды құлып.
en:
  description: >-
    A premium Philips smart lock featuring seven unlocking methods, including
    Face ID and palm vein recognition. Equipped with three cameras, a video door
    viewer, a PIR motion sensor, Wi-Fi connectivity, and HomeAccess app control.
    Powered by a 5000 mAh battery with wireless charging support.
  seoTitle: Philips 902 MVP — Buy Philips Smart Lock in Kazakhstan | iLOCK
  seoDescription: >-
    Philips 902 MVP is a flagship smart lock featuring a premium gold finish,
    crafted from zinc alloy and tempered glass. It combines sophisticated design
    with an advanced level of security.
  body: >-
    The door can be unlocked in 7 ways: Face ID facial recognition, palm vein
    recognition, fingerprint, PIN code, RFID key card, mobile app, or mechanical
    key.


    Palm vein recognition is one of the most reliable biometric technologies.
    The unique pattern of blood vessels is extremely difficult to forge or
    duplicate.


    The triple-camera system and video door viewer provide comprehensive
    monitoring of your entrance, while the PIR motion sensor detects movement
    and alerts you when someone is near your door.


    The built-in doorbell and two-way audio communication allow you to speak
    with visitors directly through the app. The voice-changing feature during
    video calls helps protect your privacy when communicating with strangers.


    With Wi-Fi connectivity and the HomeAccess app, you can control your lock
    from anywhere in the world.


    The lock operates fully automatically, locking and unlocking your door
    without unnecessary effort.


    Its memory can store up to 100 fingerprints, 60 PIN codes, 50 facial
    profiles, and 50 palm vein profiles.


    The 5000 mAh lithium-polymer battery provides 3–6 months of operation on a
    single charge and supports wireless charging.

    - Operating temperature: −20°C to +60°C

    - Interface languages: Russian and English

    - Warranty: 2 years

    Philips 902 MVP is designed for those who want maximum security without
    compromising on style.
