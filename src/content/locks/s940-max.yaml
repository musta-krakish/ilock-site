en:
  description: >-
    S940 Max is a modern smart lock featuring Face ID, a video door viewer and
    mobile app control.
  seoTitle: S940 Max — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    S940 Max is a modern smart lock featuring Face ID, a video door viewer and
    mobile app control.
  body: >-
    S940 Max is a modern smart lock featuring Face ID, a video door viewer and
    mobile app control.


    The model supports multiple unlocking methods: facial recognition,
    fingerprint, PIN code, card or key fob, the Tuya Smart mobile app and a
    mechanical key.


    The built-in camera and video door viewer allow you to monitor activity
    outside your door in real time, while two-way audio communication lets you
    speak with visitors.


    With Wi-Fi connectivity, you can control the lock directly from your
    smartphone. It also features a built-in doorbell and an emergency charging
    function.


    The built-in 4200 mAh rechargeable battery provides up to 4–6 months of
    operation without recharging. The lock features a semi-automatic mechanism.
