  body: >+
    Lockin X9 Pro — умный замок из экосистемы Xiaomi с видеоглазком, экраном и
    видеосвязью.

    Открытие одним хватом. Сканер отпечатка встроен в ручку. Не нужно сначала
    прикладывать палец, а потом нажимать ручку: всё происходит одним движением.

    Видно, кто за дверью. Широкоугольная камера в глазке передаёт картинку на
    экран 3,5" на внутренней стороне двери. Подходить к двери и смотреть в
    глазок не нужно.

    Видеосвязь из любой точки. Если гость звонит, а вас нет дома, вы видите его
    и разговариваете с ним через приложение на телефоне.

    Двойное питание. Основной аккумулятор на 5000 мАч плюс резервные батарейки
    AA. Когда заряд заканчивается, замок предупреждает, а в крайнем случае его
    можно запитать от пауэрбанка.

    Временные пароли для гостей, курьеров и клининга можно отправлять удалённо.

    Защита: тревога после нескольких неверных попыток, защита глазка от взлома и
    отдельная блокировка изнутри.

