    Lockin X9 Pro — видеокөзшесі, экраны және бейнебайланыс функциясы бар Xiaomi
    экожүйесіндегі ақылды құлып.
  seoTitle: Lockin X9 PRO — Қазақстанда ақылды құлып сатып алу | iLOCK
  seoDescription: >-
    Lockin X9 Pro — видеокөзшесі, экраны және бейнебайланыс функциясы бар Xiaomi
    экожүйесіндегі ақылды құлып.
  body: >-
    Бір қимылмен ашу. Саусақ ізі сканері тұтқаның ішіне орнатылған. Алдымен
    саусақты сканерге тигізіп, содан кейін тұтқаны басудың қажеті жоқ — есік бір
    қимылмен ашылады.


    Есіктің сыртында кім тұрғанын көруге болады. Кең бұрышты камера есіктің ішкі
    жағындағы 3,5 дюймдік экранға бейнені көрсетеді. Есікке жақындап, көзшеден
    қараудың қажеті жоқ.


    Кез келген жерден бейнебайланыс. Қонақ қоңырау шалғанда, сіз үйде болмасаңыз
    да, оны көріп, телефондағы қосымша арқылы сөйлесе аласыз.


    Қос қуат көзі. Негізгі 5000 мА·сағ аккумулятор және қосымша AA батареялары
    бар. Қуат азайғанда құлып алдын ала ескертеді. Қажет болған жағдайда
    пауэрбанк арқылы да қуаттауға болады.


    Қонақтарға, курьерлерге және тазалық қызметкерлеріне арналған уақытша
    құпиясөздерді қашықтан жіберуге болады.


    Қауіпсіздік. Қате құпиясөз бірнеше рет енгізілген жағдайда дабыл іске
    қосылады. Көзше бұзудан қорғалған, сонымен қатар есікті ішкі жағынан бөлек
    бұғаттау мүмкіндігі бар.
en:
  description: >-
    Lockin X9 Pro is a smart lock from the Xiaomi ecosystem, featuring a video
    peephole, an internal display, and two-way video communication.
  seoTitle: Lockin X9 PRO — Buy a Smart Lock in Kazakhstan | iLOCK
  seoDescription: >-
    Lockin X9 Pro is a smart lock from the Xiaomi ecosystem, featuring a video
    peephole, an internal display, and two-way video communication.
  body: >-
    Lockin X9 Pro is a smart lock from the Xiaomi ecosystem, featuring a video
    peephole, an internal display, and two-way video communication.


    One-grip unlocking. The fingerprint scanner is built into the handle. There
    is no need to scan your finger first and then press the handle — the door
    unlocks in one simple motion.


    See who is at your door. The wide-angle camera displays the image on a
    3.5-inch screen mounted on the inside of the door. You don't need to
    approach the door or look through the peephole.


    Video calls from anywhere. If a visitor rings the doorbell while you're
    away, you can see them and talk to them through the mobile app.


    Dual power supply. The lock features a main 5000 mAh rechargeable battery
    and backup AA batteries. It provides a low-battery warning and can also be
    powered using a power bank if needed.


    Temporary passwords for guests, delivery personnel, and cleaning staff can
    be shared remotely.


    Security features. An alarm is triggered after several incorrect access
    attempts. The peephole is protected against tampering, and a separate indoor
    locking function provides additional security.
