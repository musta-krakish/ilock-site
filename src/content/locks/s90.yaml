    алақан тамырларын тану (50 пайдаланушыға дейін), карта-брелок, механикалық
    кілт және iCSeeHome мобильді қосымшасы арқылы басқару. Құлып Wi-Fi
    қосылымымен, есік қоңырауымен, қос камерамен, бейнекөзшемен және
    келушілермен сөйлесуге мүмкіндік беретін екіжақты аудиобайланыс функциясымен
    жабдықталған. Толық автоматты құлыптау функциясы күнделікті пайдалануға
    қосымша ыңғайлылық береді. Сыйымдылығы 4200 мАч аккумулятор бір зарядпен 4–6
    айға дейін автономды жұмыс істеуді қамтамасыз етеді. Сонымен қатар апаттық
    қуаттандыру функциясы қарастырылған. Корпусы алюминий қорытпасынан жасалған,
    түсі — қара. Жұмыс температурасының диапазоны −20-тан +60 °C-қа дейін.
    Интерфейс тілі — орыс тілі. Кепілдік мерзімі — 2 жыл.
en:
  description: >-
    iLock S90 is an advanced smart biometric door lock featuring facial
    recognition, fingerprint scanning, and palm vein recognition. It supports 7
    unlocking methods and is equipped with a dual camera, video peephole, and
    two-way audio communication. The lock can be controlled via the iCSeeHome
    app. Its 4200 mAh rechargeable battery provides up to 4–6 months of
    operation on a single charge.
  seoTitle: S90 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: ' iLock S90 smart lock with facial recognition, fingerprint and palm vein scanning. Dual camera, video peephole, Wi-Fi connectivity, two-way audio, and iCSeeHome app control. 2-year warranty.'
  body: >-
    iLock S90 is a next-generation smart door lock combining advanced biometric
    technology, video surveillance, and convenient access control. The model
    supports 7 unlocking methods: fingerprint recognition (up to 100 users), PIN
    code (up to 20 codes), facial recognition (up to 50 users), palm vein
    recognition (up to 50 users), key fob card, mechanical key, and control via
    the iCSeeHome mobile app. The lock features Wi-Fi connectivity, a built-in
    doorbell, a dual camera, a video peephole, and two-way audio communication,
    allowing you to communicate with visitors. The fully automatic locking
    function provides additional convenience for everyday use. Its 4200 mAh
    rechargeable battery provides up to 4–6 months of operation on a single
    charge. An emergency charging function is also available. The body is made
    of aluminum alloy and comes in black. The operating temperature range is
    −20°C to +60°C. The interface language is Russian. Warranty: 2 years.
