ru:
  description: >-
    Двусторонняя камера и большой экран: видно и того, кто у двери, и того, кто
    подошёл изнутри. Встроенный датчик движения и звуковая сигнализация.
  seoTitle: S90 — купить умный замок iLock в Казахстане | iLOCK
  seoDescription: >-
    Двусторонняя камера и большой экран: видно и того, кто у двери, и того, кто
    подошёл изнутри.
  body: >-
    S90 — старшая модель iLock с двусторонней камерой: она снимает и снаружи, и
    со стороны квартиры. Face ID открывает дверь за доли секунды, а экран на
    внешней панели и двусторонняя аудиосвязь превращают замок в полноценный
    видеодомофон. Встроенный датчик движения и звуковая сигнализация
    обеспечивают дополнительную защиту вашего дома. При обнаружении движения
    замок активирует тревожное оповещение, а уведомление о тревоге поступает
    прямо в приложение на вашем смартфоне. 
