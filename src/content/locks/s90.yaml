en:
  description: >-
    A dual camera and a large screen: you see who is at the door and who
    approached from inside. Built-in Motion Sensor and Audible Alarm:
  seoTitle: S90 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    A dual camera and a large screen: you see who is at the door and who
    approached from inside.
  body: >-
    S90 is the senior iLock model with a dual camera that films both outside and
    from the apartment side. Face ID opens the door in a fraction of a second,
    while the screen on the outer panel and two-way audio turn the lock into a
    full video intercom. The built-in motion sensor and audible alarm provide an
    additional layer of security for your home. When motion is detected, the
    lock triggers an alarm, and a notification is sent directly to the app on
    your smartphone.
