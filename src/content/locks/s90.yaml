en:
  description: >-
    iLock S90 is a modern smart lock featuring Face ID, palm vein recognition
    and a video door viewer, providing convenient and secure access to your
    home.
  seoTitle: S90 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    iLock S90 is a modern smart lock featuring Face ID, palm vein recognition
    and a video door viewer, providing convenient and secure access to your
    home.
  body: >-
    iLock S90 is a modern smart lock featuring Face ID, palm vein recognition
    and a video door viewer, providing convenient and secure access to your
    home.


    The model supports multiple unlocking methods: facial recognition,
    fingerprint, PIN code, card or key fob, mobile app and mechanical key.


    Two built-in cameras and a video door viewer allow you to monitor activity
    outside your door, while two-way audio communication lets you speak with
    visitors.


    With Wi-Fi connectivity, you can control the lock directly from your
    smartphone. The fully automatic mechanism makes locking and unlocking the
    door even more convenient.


    The built-in 4200 mAh rechargeable battery provides up to 4–6 months of
    operation without recharging.
