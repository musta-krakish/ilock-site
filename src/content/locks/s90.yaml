  body: >-
    iLock S90 — современный умный замок с Face ID, распознаванием вен ладони и
    видеоглазком для удобного и безопасного доступа в ваш дом.


    Модель поддерживает несколько способов открытия: по лицу, отпечатку пальца,
    PIN-коду, карте или брелоку, через мобильное приложение и с помощью
    механического ключа.


    Две встроенные камеры и видеоглазок позволяют наблюдать за происходящим
    перед дверью, а двусторонняя аудиосвязь — разговаривать с посетителями.


    Благодаря Wi-Fi подключению вы можете управлять замком со смартфона.
    Полностью автоматический механизм делает открытие и закрытие двери ещё
    удобнее.


    Встроенный аккумулятор ёмкостью 4200 мАч обеспечивает до 4–6 месяцев
    автономной работы.
