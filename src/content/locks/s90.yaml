ru:
  description: >-
    iLock S90 — современный умный биометрический замок с распознаванием лица,
    отпечатка пальца и вен ладони. Поддерживает 7 способов разблокировки,
    оснащён двойной камерой, видеоглазком и двусторонней аудиосвязью. Управление
    осуществляется через приложение iCSeeHome. Аккумулятор ёмкостью 4200 мАч
    обеспечивает до 4–6 месяцев работы без подзарядки.
  seoTitle: S90 — купить умный замок iLock в Казахстане | iLOCK
  seoDescription: >-
    Умный замок iLock S90 с распознаванием лица, отпечатка пальца и вен ладони.
    Двойная камера, видеоглазок, Wi-Fi, двусторонняя аудиосвязь и управление
    через iCSeeHome. Гарантия 2 года.
  body: >-
    iLock S90 — интеллектуальный замок нового поколения, сочетающий
    биометрические технологии, видеонаблюдение и удобное управление доступом.
    Модель поддерживает 7 способов разблокировки: распознавание отпечатка пальца
    (до 100 пользователей), PIN-код (до 20 кодов), распознавание лица (до 50
    пользователей), распознавание вен ладони (до 50 пользователей),
    карта-брелок, механический ключ и управление через мобильное приложение
    iCSeeHome. Замок оснащён Wi-Fi подключением, дверным звонком, двойной
    камерой, видеоглазком и функцией двусторонней аудиосвязи, позволяющей
    общаться с посетителями. Функция полностью автоматического запирания
    обеспечивает дополнительное удобство при ежедневном использовании.
    Аккумулятор ёмкостью 4200 мАч обеспечивает до 4–6 месяцев автономной работы.
    Также предусмотрена функция аварийной зарядки. Корпус выполнен из
    алюминиевого сплава в чёрном цвете. Рабочий температурный диапазон
    составляет от −20 до +60 °C. Язык интерфейса — русский. Гарантия — 2 года.
