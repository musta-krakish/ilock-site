    автоматты құлыптау, түнгі ысырма, PIN-кодты іріктеуден қорғау және
    аккумулятор заряды төмендегені туралы хабарлама кіреді.
en:
  description: >-
    H7-PRO smart lock featuring facial recognition, a built-in camera and an
    indoor display. Supports fingerprint, PIN code, RFID card, mechanical key
    and mobile app access.
  seoTitle: H7-PRO — Buy Philips Smart Lock in Kazakhstan | iLOCK
  seoDescription: >-
    H7-PRO smart lock with facial recognition, built-in camera, indoor display
    and TTLock app control. Multiple unlocking methods and advanced security
    features.
  body: >-
    H7-PRO smart lock combines modern identification technology with convenient
    access control. It features facial recognition, a built-in camera for user
    identification and visitor viewing, as well as an indoor display for viewing
    images from the external camera. The lock supports six unlocking methods:
    facial recognition, fingerprint, PIN code, RFID card, mechanical key and the
    TTLock mobile application. Bluetooth connectivity and an optional Wi-Fi
    gateway enable remote access management, temporary passcode creation, user
    management and access history monitoring. Security features include
    automatic locking, a night latch, PIN code anti-guessing protection and low
    battery notifications.
