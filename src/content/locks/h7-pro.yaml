  body: >-
    Умный замок H7-PRO сочетает современные технологии идентификации и удобное
    управление доступом. Модель оснащена системой распознавания лица, встроенной
    камерой для идентификации пользователя и просмотра посетителей, а также
    внутренним дисплеем для отображения изображения с внешней камеры. Замок
    поддерживает шесть способов открытия: распознавание лица, отпечаток пальца,
    PIN-код, RFID-карту, механический ключ и мобильное приложение TTLock.
    Благодаря Bluetooth и дополнительному Wi-Fi-шлюзу доступно удалённое
    управление, создание временных кодов, управление пользователями и просмотр
    истории открытий. Среди защитных функций — автоматическая блокировка, ночная
    задвижка, защита от подбора PIN-кода и уведомление о низком заряде
    аккумулятора.
