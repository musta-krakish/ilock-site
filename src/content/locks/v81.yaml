en:
  description: >-
    iLock V81 is a smart lock featuring Face ID, palm vein recognition and a
    motion sensor for convenient and secure access to your home.
  seoTitle: v81 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    iLock V81 is a smart lock featuring Face ID, palm vein recognition and a
    motion sensor for convenient and secure access to your home.
  body: >-
    iLock V81 is a smart lock featuring Face ID, palm vein recognition and a
    motion sensor for convenient and secure access to your home.


    The model supports multiple unlocking methods: facial recognition, palm vein
    recognition, fingerprint, PIN code, card or key fob, and mechanical key.


    The built-in video door viewer lets you see who is standing outside your
    door, while two-way audio communication allows you to speak with visitors.


    With Wi-Fi connectivity, you can control the lock through the Tuya Smart
    app. The PIR motion sensor detects movement in front of your door.


    The 4200 mAh rechargeable battery provides up to 4–6 months of operation
    without recharging. The lock also features a fully automatic locking
    mechanism.
