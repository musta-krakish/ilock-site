en:
  description: >-
    iLock V81 is a modern smart biometric door lock featuring facial
    recognition, fingerprint scanning, and palm vein recognition. It supports 7
    unlocking methods and is equipped with a video peephole, PIR motion sensor,
    Wi-Fi connectivity, and two-way audio communication. The lock can be
    controlled via the Tuya Smart app. Its 4200 mAh rechargeable battery
    provides up to 4–6 months of operation.
  seoTitle: v81 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    iLock V81 smart lock with facial recognition, fingerprint and palm vein
    scanning. Video peephole, PIR motion sensor, Wi-Fi connectivity, two-way
    audio, and Tuya Smart app control. 2-year warranty.
  body: ' iLock V81 is a modern smart door lock combining advanced biometric technology, video monitoring, and convenient access control. The model supports 7 unlocking methods: fingerprint recognition (up to 100 users), PIN code (up to 20 codes), facial recognition (up to 50 users), palm vein recognition (up to 50 users), key fob card, mechanical key, and control via the Tuya Smart mobile app. The lock features Wi-Fi connectivity, a built-in doorbell, a PIR motion sensor, a video peephole, and two-way audio communication, allowing you to communicate with visitors. The fully automatic locking function provides additional convenience for everyday use. Its 4200 mAh lithium-ion rechargeable battery provides up to 4–6 months of operation on a single charge. An emergency power supply function is also available. The body is made of aluminum alloy and comes in black. The operating temperature range is −20°C to +60°C. Supported interface languages: Russian and Kazakh. Warranty: 2 years.'
