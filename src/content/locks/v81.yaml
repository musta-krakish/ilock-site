  body: >-
    iLock V81 — современный интеллектуальный замок, объединяющий биометрические
    технологии, функции видеонаблюдения и удобное управление доступом. Модель
    поддерживает 7 способов разблокировки: распознавание отпечатка пальца (до
    100 пользователей), PIN-код (до 20 кодов), распознавание лица (до 50
    пользователей), распознавание вен ладони (до 50 пользователей),
    карта-брелок, механический ключ и управление через мобильное приложение Tuya
    Smart. Замок оснащён Wi-Fi подключением, встроенным дверным звонком,
    PIR-датчиком движения, видеоглазком и функцией двусторонней аудиосвязи,
    позволяющей общаться с посетителями. Полностью автоматическое запирание
    обеспечивает дополнительный комфорт и удобство в повседневном использовании.
    Литий-ионный аккумулятор ёмкостью 4200 мАч обеспечивает до 4–6 месяцев
    работы без подзарядки. Также предусмотрена функция аварийного питания.
    Корпус изготовлен из алюминиевого сплава, цвет — чёрный. Рабочий
    температурный диапазон составляет от −20 до +60 °C. Поддерживаемые языки
    интерфейса — русский и казахский. Гарантия — 2 года.
