  body: >-
    S819-2 Max is a modern smart lock with a video door viewer and remote
    control, designed to make your home safer and everyday access more
    convenient.


    Forget about carrying traditional keys! The lock supports five unlocking
    methods: fingerprint, PIN code, card or key fob, the Tuya Smart app, and a
    mechanical key.


    The built-in video door viewer lets you see who is standing outside your
    door, while the doorbell and security alarm provide additional safety and
    convenience.


    With Wi-Fi connectivity, you can control the lock directly from your
    smartphone. The model operates on four AA batteries, providing up to 10
    months of battery life. An emergency charging function is also available.


    S819-2 Max — more convenience, control and security for your home every day.
