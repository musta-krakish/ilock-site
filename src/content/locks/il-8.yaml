ru:
  description: >-
    Флагман бренда iLock: распознавание лица и вен ладони, видеоглазок и
    полностью автоматический замок.
  seoTitle: iL-8 — купить умный замок iLock в Казахстане | iLOCK
  seoDescription: >-
    Флагман бренда iLock: распознавание лица и вен ладони, видеоглазок и
    полностью автоматический замок.
  body: >+
    iL-8 — современный умный замок с Face ID, биометрическим распознаванием вен
    ладони и видеоглазком, сочетающий передовые технологии, комфорт и высокий
    уровень безопасности.

    Модель оснащена несколькими способами разблокировки, включая распознавание
    лица и вен ладони, что позволяет открывать дверь быстро и без использования
    ключей. Встроенный видеоглазок и двусторонняя аудиосвязь обеспечивают
    возможность контролировать происходящее перед входной дверью и общаться с
    посетителями.

    Благодаря подключению к Wi-Fi и интеграции с приложением вы можете управлять
    замком со смартфона. 

    Полностью автоматический механизм обеспечивает удобное запирание и открытие
    двери.

kk:
  description: >-
    iLock брендінің флагманы: бет пен алақан тамырын тану, бейнекөзше және толық
    автоматты құлып.
  seoTitle: iL-8 — Қазақстанда iLock ақылды құлыпты сатып алу | iLOCK
  seoDescription: >-
    iLock брендінің флагманы: бет пен алақан тамырын тану, бейнекөзше және толық
    автоматты құлып.
  body: >-
    iL-8 — Face ID, алақан тамырларын биометриялық тану жүйесі және бейнекөзшесі
    бар заманауи ақылды құлып. Ол озық технологияларды, жайлылық пен жоғары
    қауіпсіздік деңгейін біріктіреді.

    Модель бірнеше құлыпты ашу тәсілімен жабдықталған. Олардың ішінде
    бет-әлпетті және алақан тамырларын тану жүйелері бар. Бұл есікті кілтсіз,
    жылдам әрі ыңғайлы ашуға мүмкіндік береді. Кіріктірілген бейнекөзше мен
    екіжақты аудиобайланыс есіктің алдында не болып жатқанын бақылауға және
    келушілермен сөйлесуге мүмкіндік береді.

    Wi-Fi желісіне қосылу және мобильді қосымшамен біріктіру арқылы құлыпты
    смартфоннан басқара аласыз.

    Толық автоматты механизмі есікті ашу мен құлыптауды барынша ыңғайлы етеді.
en:
  description: >-
    The flagship of the iLock brand: face and palm-vein recognition, a video
    peephole and a fully automatic lock.
  seoTitle: iL-8 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    The flagship of the iLock brand: face and palm-vein recognition, a video
    peephole and a fully automatic lock.
  body: >-
    iL-8 is a modern smart lock featuring Face ID, biometric palm vein
    recognition and a video door viewer, combining advanced technology,
    convenience and a high level of security.

    The model offers multiple unlocking methods, including facial recognition
    and palm vein recognition, allowing you to unlock the door quickly without
    using keys. The built-in video door viewer and two-way audio communication
    allow you to monitor activity outside your door and communicate with
    visitors.

    With Wi-Fi connectivity and mobile app integration, you can conveniently
    control the lock directly from your smartphone.

    Its fully automatic mechanism ensures effortless door locking and unlocking.
