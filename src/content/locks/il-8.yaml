  body: >-
    iLock iL-8 — биометриялық сәйкестендірудің заманауи технологияларын,
    бейнебақылау мүмкіндігін және үй қауіпсіздігін ыңғайлы басқаруды
    біріктіретін ақылды құлып. Құлыпты ашудың 7 әдісін қолдайды: саусақ ізі
    арқылы (100 пайдаланушыға дейін), PIN-код арқылы (20 кодқа дейін),
    бет-әлпетті тану арқылы (50 пайдаланушыға дейін), алақан тамырларын тану
    арқылы (50 пайдаланушыға дейін), карта-брелок арқылы, механикалық кілтпен
    және Tuya Smart мобильді қосымшасы арқылы. Құлып бейнекөзшемен, Wi-Fi
    қосылымымен, есік қоңырауымен, екіжақты аудиобайланыспен және есікті толық
    автоматты түрде құлыптау функциясымен жабдықталған. Сыйымдылығы 4200 мАч
    аккумулятор бір зарядпен 4–6 айға дейін жұмыс істеуге мүмкіндік береді.
    Сондай-ақ апаттық қуаттандыру функциясы қарастырылған. Корпусы алюминий
    қорытпасынан жасалған, түсі — қара. Жұмыс температурасының диапазоны −20-тан
    +50 °C-қа дейін. Интерфейс тілі — орыс тілі. Кепілдік мерзімі — 2 жыл.
en:
  description: >-
    iLock iL-8 is a smart biometric door lock featuring facial recognition,
    fingerprint scanning, and palm vein recognition. It supports 7 unlocking
    methods, offers control via the Tuya Smart app, and features fully automatic
    locking. Equipped with a 4200 mAh rechargeable battery, it operates in
    temperatures ranging from −20°C to +50°C.
  seoTitle: iL-8 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    iLock iL-8 smart lock with facial recognition, palm vein scanning, video
    peephole, and Tuya Smart app control. 7 unlocking methods, automatic
    locking, and a 2-year warranty.
  body: >-
    iLock iL-8 is an advanced smart door lock that combines modern biometric
    identification technologies, video monitoring, and convenient home access
    control. It supports 7 unlocking methods: fingerprint recognition (up to 100
    fingerprints), PIN code (up to 20 codes), facial recognition (up to 50
    users), palm vein recognition (up to 50 users), key fob card, mechanical
    key, and control via the Tuya Smart mobile app. The lock features a video
    peephole, Wi-Fi connectivity, a built-in doorbell, two-way audio
    communication, and fully automatic locking. Its 4200 mAh rechargeable
    battery provides up to 4–6 months of operation on a single charge. An
    emergency charging function is also available. The body is made of aluminum
    alloy and comes in black. The operating temperature range is −20°C to +50°C.
    The interface language is Russian. Warranty: 2 years.
