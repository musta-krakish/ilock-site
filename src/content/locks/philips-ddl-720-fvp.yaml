en:
  description: >-
    A smart lock that recognizes your face. Unlock your door in five ways: 3D
    face recognition, fingerprint, PIN code, RFID key fob, or mechanical key.
    Features a wide-angle camera with night vision, video calling, and
    smartphone control from anywhere in the world.
  seoTitle: Philips 720 FVP — Buy Philips Smart Lock in Kazakhstan | iLOCK
  seoDescription: >-
    Philips DDL720-FVP is a smart lock that recognizes your face, protects your
    home, and makes security simple and convenient.
  body: >-
    Philips DDL720-FVP is a smart lock that recognizes your face, protects your
    home, and makes security simple and convenient.


    5 Ways to Unlock Your Door

    - 3D Face Recognition: unlocks in one second, keeping your hands free

    - Fingerprint

    - Personal PIN code

    - RFID key fob

    - Mechanical key for emergencies

    Smart Monitoring

    - Wide-angle camera with night vision

    - Video calling and two-way communication with visitors at your door

    - Push notifications to your smartphone

    Control from Anywhere in the World

    - Access history: see who entered and when

    - Temporary guest codes for family members, babysitters, or cleaning staff

    - Add and remove users

    - Alerts for security-related events

    Security and Convenience

    - Automatic locking: the door locks automatically as soon as it closes

    - Security mode: an alarm is triggered if someone attempts to unlock the
    door from the inside

    - Privacy mode: prevents the door from being unlocked from outside while you
    are at home

    - Russian voice guidance and silent mode
