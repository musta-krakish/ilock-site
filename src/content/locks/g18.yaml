    доступа.

    Прочный корпус из алюминиевого сплава и закалённого стекла сочетается с
    минималистичным дизайном, который гармонично дополнит современный интерьер.

    Для дополнительной безопасности предусмотрена сигнализация при попытке
    вскрытия, а уведомление о низком заряде батареи поможет своевременно
    заменить элементы питания. При необходимости можно воспользоваться функцией
    аварийной зарядки.
