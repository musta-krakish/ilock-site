en:
  description: >-
    iLock G18 is a functional smart lock that eliminates the need for
    traditional keys and makes everyday door access more convenient.
  seoTitle: G18 — buy an iLock smart lock in Kazakhstan | iLOCK
  seoDescription: >-
    iLock G18 is a functional smart lock that eliminates the need for
    traditional keys and makes everyday door access more convenient.
  body: >-
    iLock G18 is a functional smart lock that eliminates the need for
    traditional keys and makes everyday door access more convenient.


    The model supports five unlocking methods: fingerprint recognition, PIN
    code, card or key fob, the TTLock mobile app, and a mechanical key. This
    allows each user to choose the most convenient access method.


    Its durable aluminum alloy and tempered glass body is complemented by a
    minimalist design that blends seamlessly with modern interiors.


    For added security, the lock features an alarm system that activates in case
    of an attempted break-in. A low battery notification helps ensure timely
    battery replacement. An emergency charging function is also available when
    needed.
